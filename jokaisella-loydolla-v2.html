<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Elävä Kauppa — Jokaisella löydöllä on elämä takanaan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Manrope:wght@400;600;700&display=swap');

  :root {
    --vihrea: #00774A;
    --koralli: #FBAB97;
    --koralli-teksti: #C85A3E;
    --sammal: #D8E9A2;
    --paperi: #FBF9F4;
    --muste: #1A1A17;
    --valkoinen: #FFFFFF;
    --vaaleanvihrea: #C5D8AF;
    --loop: 18s;
    --slot: 2.4s; /* yhden tuote-iskun väli */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--muste);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Manrope', sans-serif;
  }

  .stage {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 9 / 16;
    background: var(--koralli);
    border-radius: 22px;
    overflow: hidden;
  }

  /* ---------- tuote-iskut ---------- */
  .beat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 0 34px; text-align: center;
    opacity: 0;
    animation: beatCycle var(--loop) ease infinite;
  }
  .beat.left  { align-items: flex-start; text-align: left; }
  .beat.right { align-items: flex-end;   text-align: right; }

  .beat .photo-wrap {
    width: 92px; height: 92px;
    border-radius: 18px;
    background: var(--valkoinen);
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    box-shadow: 0 6px 18px rgba(26,26,23,.12);
    transform: scale(.7);
    animation: iconPop var(--loop) ease infinite;
  }
  .beat.big .photo-wrap { width: 116px; height: 116px; }
  .beat .photo-wrap img { width: 100%; height: 100%; object-fit: contain; }

  .beat p {
    margin: 0;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.15;
    letter-spacing: -0.006em;
    max-width: 300px;
    color: var(--valkoinen);
  }
  .beat.big p { font-size: 1.85rem; }

  @keyframes beatCycle {
    0%             { opacity: 0; }
    1.5%           { opacity: 1; }
    9.5%           { opacity: 1; }
    11.5%, 100%    { opacity: 0; }
  }
  @keyframes iconPop {
    0%, 100% { transform: scale(.7); }
    1.5%     { transform: scale(1); }
    9.5%     { transform: scale(1); }
    11.5%    { transform: scale(.85); }
  }

  .beat.b1 { animation-delay: 0s; }
  .beat.b2 { animation-delay: calc(var(--slot) * 1); }
  .beat.b3 { animation-delay: calc(var(--slot) * 2); }
  .beat.b4 { animation-delay: calc(var(--slot) * 3); }

  /* ---------- iskulause koko näytölle, vihreä tausta ---------- */
  .headline {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 30px; text-align: center;
    background: var(--vaaleanvihrea);
    opacity: 0;
    animation: headlineCycle var(--loop) ease infinite;
  }
  .headline p {
    margin: 0;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 2.1rem;
    line-height: 1.18;
    letter-spacing: -0.008em;
    color: var(--vihrea);
  }
  @keyframes headlineCycle {
    0%, 51%      { opacity: 0; }
    53%          { opacity: 1; }
    75%          { opacity: 1; }
    80%, 100%    { opacity: 0; }
  }

  /* ---------- logo viimeisenä: zoomaa sisään vaaleanvihreälle taustalle ---------- */
  .closer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--vaaleanvihrea);
    opacity: 0;
    animation: closerCycle var(--loop) ease infinite;
  }
  .closer .logo-mark {
    width: 60%;
    max-width: 280px;
    height: auto;
    transform: scale(.82);
    animation: logoZoom var(--loop) ease infinite;
  }
  @keyframes closerCycle {
    0%, 73%     { opacity: 0; }
    80%         { opacity: 1; }
    98%         { opacity: 1; }
    99.5%, 100% { opacity: 0; }
  }
  @keyframes logoZoom {
    0%, 73%  { transform: scale(.82); }
    80%      { transform: scale(1.06); }
    88%      { transform: scale(1); }
    98%      { transform: scale(1); }
    100%     { transform: scale(.82); }
  }

  @media (prefers-reduced-motion: reduce) {
    .beat, .headline, .closer, .photo-wrap, .logo-mark { animation: none !important; }
    .beat { opacity: 0; }
    .beat.b1 { opacity: 1; }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- 1 · astiasto -->
  <div class="beat left b1">
    <div class="photo-wrap">
      <img src="https://www.elavakauppa.fi/storage/product_images/7/tuotesivu_arabiaastiasto_a00002747_1d245f999ec3_1.webp" alt="Astiasto">
    </div>
    <p>Satoja juhlapuheita kuunnellut astiasto</p>
  </div>

  <!-- 2 · villapaita -->
  <div class="beat right b2">
    <div class="photo-wrap">

    </div>
    <p>Lukemattomia halauksia saanut villapaita</p>
  </div>

  <!-- 3 · kamera (iso) -->
  <div class="beat b3 big">

      <img src="https://www.elavakauppa.fi/storage/product_images/8/tuotesivu_yashica-c_a00005028_21babcbb7486_1.webp" alt="Kamera">
    </div>

  </div>

    </div>
    <p>Satoja serenadeja soittanut kitara</p>
  </div>

  <!-- iskulause -->
  <div class="headline">
    <p>Jokaisella löydöllä<br>on elämä takanaan.</p>
  </div>
